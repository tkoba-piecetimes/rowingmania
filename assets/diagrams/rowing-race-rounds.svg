<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" fill="#1f2a44">
<title>大学ボートの勝ち上がりの一例。予選の上位が準決勝へ、残りは敗者復活戦へ。準決勝の上位が決勝Aで優勝を争い、それ以外は決勝Bに回る</title>
<rect width="640" height="410" fill="#ffffff"/>
<text x="20" y="30" font-size="16" text-anchor="start" font-weight="normal" fill="#9aa3b2">勝ち上がりの流れの一例（種目の出場艇数で変わる）</text><rect x="20" y="120" width="130" height="70" rx="8" fill="#e6efff" stroke="#2f6fd6" stroke-width="2.5"/><text x="85.0" y="153.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a44">予選</text><text x="85.0" y="175.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2a44">最初の組分けレース</text><rect x="20" y="250" width="130" height="70" rx="8" fill="#f4f4f4" stroke="#9aa3b2" stroke-width="2.5"/><text x="85.0" y="283.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a44">敗者復活戦</text><text x="85.0" y="305.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2a44">もう一度の機会</text><rect x="250" y="120" width="140" height="70" rx="8" fill="#e6efff" stroke="#2f6fd6" stroke-width="2.5"/><text x="320.0" y="162.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a44">準決勝</text><rect x="470" y="70" width="150" height="70" rx="8" fill="#fff4d6" stroke="#f2a900" stroke-width="2.5"/><text x="545.0" y="103.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a44">決勝A</text><text x="545.0" y="125.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2a44">優勝を決める</text><rect x="470" y="190" width="150" height="70" rx="8" fill="#f4f4f4" stroke="#9aa3b2" stroke-width="2.5"/><text x="545.0" y="223.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a44">決勝B</text><text x="545.0" y="245.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2a44">下位の順位を決める</text><line x1="150" y1="155" x2="240.0" y2="155.0" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/><polygon points="250,155 240,161 240,149" fill="#1f2a44"/><rect x="181" y="130" width="38" height="22" fill="#ffffff"/><text x="200" y="146" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2a44">上位</text><line x1="85" y1="190" x2="85.0" y2="240.0" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/><polygon points="85,250 79,240 91,240" fill="#1f2a44"/><rect x="38" y="210" width="94" height="22" fill="#ffffff"/><text x="85" y="226" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2a44">上位に入れず</text><line x1="150" y1="285" x2="262.1595417553824" y2="196.2070294436556" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/><polygon points="270,190 266,201 258,192" fill="#1f2a44"/><rect x="206" y="236" width="38" height="22" fill="#ffffff"/><text x="225" y="252" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2a44">上位</text><line x1="390" y1="140" x2="460.7152330911474" y2="111.71390676354103" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/><polygon points="470,108 463,117 458,106" fill="#1f2a44"/><rect x="411" y="94" width="38" height="22" fill="#ffffff"/><text x="430" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2a44">上位</text><line x1="390" y1="170" x2="461.2842446287545" y2="210.0973876036744" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/><polygon points="470,215 458,215 464,205" fill="#1f2a44"/><rect x="397" y="184" width="66" height="22" fill="#ffffff"/><text x="430" y="200" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2a44">それ以外</text><text x="20" y="360" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2a44">出場艇が多い種目では、予選のあとに準々決勝が入ることもある</text><text x="20" y="386" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2a44">決勝Aに進まないと優勝は争えない（決勝Bは下位の順位決定）</text>
</svg>
