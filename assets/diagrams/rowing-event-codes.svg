<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" width="640" height="484" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" fill="#1f2a44">
<title>種目コードの読み方。先頭のmは男子、wは女子、数字は漕手の人数、xはスカル、＋はコックスあり、－はコックスなし</title>
<rect width="640" height="484" fill="#ffffff"/>
<text x="20" y="32" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a44">種目コードの読み方</text><text x="245" y="130" font-size="72" text-anchor="middle" font-weight="bold" fill="#1f2a44">m</text><text x="320" y="130" font-size="72" text-anchor="middle" font-weight="bold" fill="#1f2a44">8</text><text x="395" y="130" font-size="72" text-anchor="middle" font-weight="bold" fill="#1f2a44">+</text><line x1="245" y1="150" x2="190" y2="185" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/><text x="190" y="212" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f6fd6">男子はm</text><text x="190" y="236" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2a44">女子はw</text><line x1="320" y1="150" x2="320" y2="185" stroke="#d64545" stroke-width="4" stroke-linecap="round"/><text x="320" y="212" font-size="18" text-anchor="middle" font-weight="bold" fill="#d64545">漕手の人数</text><text x="320" y="236" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2a44">（8人）</text><line x1="395" y1="150" x2="450" y2="185" stroke="#f2a900" stroke-width="4" stroke-linecap="round"/><text x="450" y="212" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2a44">コックスの有無</text><text x="450" y="236" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2a44">＋あり　－なし</text><rect x="20" y="262" width="600" height="2" fill="#9aa3b2"/><text x="20" y="296" font-size="18" text-anchor="start" font-weight="bold" fill="#1f2a44">xが付くとスカル（1人2本）、付かなければスイープ（1人1本）</text><rect x="20" y="304" width="600" height="34" rx="6" fill="#f3f5f9"/><text x="36" y="328" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a44">m1x</text><text x="150" y="328" font-size="18" text-anchor="start" font-weight="normal" fill="#1f2a44">男子 シングルスカル</text><rect x="20" y="342" width="600" height="34" rx="6" fill="#f3f5f9"/><text x="36" y="366" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a44">w4x+</text><text x="150" y="366" font-size="18" text-anchor="start" font-weight="normal" fill="#1f2a44">女子 クォドルプル（コックスあり）</text><rect x="20" y="380" width="600" height="34" rx="6" fill="#f3f5f9"/><text x="36" y="404" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a44">m2-</text><text x="150" y="404" font-size="18" text-anchor="start" font-weight="normal" fill="#1f2a44">男子 ペア（コックスなし）</text><rect x="20" y="418" width="600" height="34" rx="6" fill="#f3f5f9"/><text x="36" y="442" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2a44">w8+</text><text x="150" y="442" font-size="18" text-anchor="start" font-weight="normal" fill="#1f2a44">女子 エイト</text>
</svg>
