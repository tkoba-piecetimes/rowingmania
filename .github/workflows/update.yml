name: Update and deploy site

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pykakasi
      - name: Fetch rowing data (jara.or.jp)
        # 過去年度はキャッシュ済みならスキップ、当年度・前年度のみ毎回再取得する
        # （fetch_rowing.py のデフォルト挙動）。新年度の大会が公開されるとここで検知される。
        run: python pipeline/fetch_rowing.py
      - name: Generate articles (大学の軌跡シリーズ)
        # 出場レース数10以上の大学を対象に、大学別インカレ全記録まとめ記事を
        # 1回の実行につき最大2本まで生成する（ストックを日次で少しずつ消化）。
        run: python pipeline/generate_articles.py
      - name: Generate site
        run: python pipeline/generate_site.py
      - name: Commit updated data & site
        if: github.event_name != 'push'
        run: |
          git config user.name "rowingmania-bot"
          git config user.email "bot@piecetimes.jp"
          git add data content site
          git diff --cached --quiet || git commit -m "chore: auto-update rowing data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # アップロード直後は公開用ファイルが一覧にまだ出ないことがあり、
      # その瞬間に当たるとデプロイが「No artifacts named github-pages」で落ちる。
      # 少し待ってからデプロイし、落ちたら間隔を空けて2回までやり直す。
      - name: Wait for the uploaded artifact to be listed
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 2
        if: steps.deployment_retry1.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
