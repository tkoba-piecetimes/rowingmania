name: Update and deploy site

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pykakasi
      - name: Fetch rowing data (jara.or.jp)
        # 過去年度はキャッシュ済みならスキップ、当年度・前年度のみ毎回再取得する
        # （fetch_rowing.py のデフォルト挙動）。新年度の大会が公開されるとここで検知される。
        run: python pipeline/fetch_rowing.py
      - name: Generate site
        run: python pipeline/generate_site.py
      - name: Commit updated data & site
        if: github.event_name != 'push'
        run: |
          git config user.name "rowingmania-bot"
          git config user.email "bot@piecetimes.jp"
          git add data site
          git diff --cached --quiet || git commit -m "chore: auto-update rowing data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
