<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" width="640" height="462" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" fill="#1f2a44">
<title>スカルは1人が左右に1本ずつ計2本のオール、スイープは1人が片側に1本のオールを持つ。ペアでは2人のオールは反対側に出る</title>
<rect width="640" height="462" fill="#ffffff"/>
<text x="20" y="30" font-size="16" text-anchor="start" font-weight="normal" fill="#9aa3b2">上から見た図（右が艇の進む向き）</text><text x="20" y="62" font-size="20" text-anchor="start" font-weight="bold" fill="#2f6fd6">スカル：1人が左右1本ずつ、計2本</text><path d="M70 150 Q100 132.0 160 132.0 L480 132.0 Q550 132.0 570 150 Q550 168.0 480 168.0 L160 168.0 Q100 168.0 70 150 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="3"/><line x1="330" y1="160" x2="330" y2="88" stroke="#2f6fd6" stroke-width="5" stroke-linecap="round"/><rect x="321" y="88" width="18" height="26" rx="4" fill="#2f6fd6"/><line x1="330" y1="140" x2="330" y2="212" stroke="#2f6fd6" stroke-width="5" stroke-linecap="round"/><rect x="321" y="186" width="18" height="26" rx="4" fill="#2f6fd6"/><circle cx="330" cy="150" r="11" fill="#1f2a44"/><text x="356" y="110" font-size="16" text-anchor="start" font-weight="normal" fill="#2f6fd6">片側のオール</text><text x="356" y="202" font-size="16" text-anchor="start" font-weight="normal" fill="#2f6fd6">反対側のオール</text><text x="20" y="262" font-size="20" text-anchor="start" font-weight="bold" fill="#d64545">スイープ：1人が片側に1本（ペアの例）</text><path d="M70 360 Q100 342.0 160 342.0 L480 342.0 Q550 342.0 570 360 Q550 378.0 480 378.0 L160 378.0 Q100 378.0 70 360 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="3"/><line x1="270" y1="370" x2="270" y2="298" stroke="#d64545" stroke-width="5" stroke-linecap="round"/><rect x="261" y="298" width="18" height="26" rx="4" fill="#d64545"/><circle cx="270" cy="360" r="11" fill="#1f2a44"/><line x1="400" y1="350" x2="400" y2="422" stroke="#d64545" stroke-width="5" stroke-linecap="round"/><rect x="391" y="396" width="18" height="26" rx="4" fill="#d64545"/><circle cx="400" cy="360" r="11" fill="#1f2a44"/><text x="296" y="320" font-size="16" text-anchor="start" font-weight="normal" fill="#d64545">1人目</text><text x="426" y="412" font-size="16" text-anchor="start" font-weight="normal" fill="#d64545">2人目</text><text x="20" y="448" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2a44">ペア・フォア・エイトでは、漕手ごとに片側だけにオールが出る</text>
</svg>
